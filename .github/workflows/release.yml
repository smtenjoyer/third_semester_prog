name: C++ CI

on:
  push:
    branches:
      - laba7
      - feature/github_actions

jobs:
  build_ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libboost-test-dev -y

      - name: List Files for debugging purposes
        run: |
          ls -R

      - name: Clean Build Directory
        run: rm -rf build

      - name: Download Boost 1.86.0
        run: |
          wget https://boostorg.jfrog.io/artifactory/main/release/1.86.0/source/boost_1_86_0.tar.bz2
          tar -xvjf boost_1_86_0.tar.bz2
          mv boost_1_86_0 boost

      - name: Build Boost
        run: |
          cd boost
          ./bootstrap.sh --with-libraries=program_options,system,filesystem # Specify needed libraries
          ./b2 install --prefix=$(pwd)/install # Install to a subdirectory of boost
          cd ..

      - name: Configure CMake with Local Boost
        run: |
          cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT=./boost/install -DCMAKE_CXX_FLAGS="-std=c++17" --no-warn-unused-cli

      - name: Build Project
        run: cmake --build build --verbose

      - name: Package Project
        run: cmake --build build --target package --verbose

      - name: List Files in Build Directory
        run: ls -R build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Ubuntu)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset-ubuntu
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/boboost-0.0.${{ github.run_number }}-Linux.deb
          asset_name: boboost-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build_macos:
    runs-on: macos-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: brew install boost

      - name: List Files for debugging purposes
        run: |
          ls -R

      - name: Clean Build Directory
        run: rm -rf build

      - name: Download Boost 1.86.0
        run: |
          wget https://boostorg.jfrog.io/artifactory/main/release/1.86.0/source/boost_1_86_0.tar.bz2
          tar -xvjf boost_1_86_0.tar.bz2
          mv boost_1_86_0 boost

      - name: Build Boost
        run: |
          cd boost
          ./bootstrap.sh --with-libraries=program_options,system,filesystem # Specify needed libraries
          ./b2 install --prefix=$(pwd)/install # Install to a subdirectory of boost
          cd ..

      - name: Configure CMake with Local Boost
        run: |
          cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT=./boost/install -DCMAKE_CXX_FLAGS="-std=c++17" --no-warn-unused-cli

      - name: Build Project
        run: cmake --build build --verbose

      - name: Package Project
        run: cmake --build build --target package --verbose

      - name: List Files in Build Directory
        run: ls -R build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (macOS)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset-macos
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/boboost-0.0.${{ github.run_number }}-macos.deb # Adjust the asset path if necessary
          asset_name: boboost-0.0.${{ github.run_number }}-macos.deb # Adjust the asset name if necessary
          asset_content_type: application/vnd.debian.binary-package # Change this to the appropriate content type for macOS, e.g., application/octet-stream if necessary.
