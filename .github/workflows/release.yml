name: C++ CI

on:
  push:
    branches:
      - laba7  # Use 'main' or your default branch
      - feature/* # Matches all feature branches

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release] # Add Debug if needed

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true

    - name: Set up Boost
      uses: conda-incubator/setup-miniconda@v2
      with:
        activate-environment: true
        auto-update-conda: false
        environment-file: environment.yml # Create this file (see below)
        python-version: 3.x # Specify a Python version

    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPATCH_VERSION=${{ github.run_number }}

    - name: Build Project
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test Project (Optional)
      if: matrix.build_type == 'Release' && runner.os == 'Linux' #Example conditional testing
      run: |
        ctest -C ${{ matrix.build_type }} # Requires adding tests to your CMakeLists.txt

    - name: Create Release
      if: ${{ matrix.build_type == 'Release' }}
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}-${{ matrix.os }}
        release_name: Release ${{ github.run_number }} (${{ matrix.os }})
        draft: false
        prerelease: false

    - name: Upload Artifact
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-artifact@v3
      with:
        name: boboost-${{ matrix.os }}
        path: build/${{ matrix.build_type }} #Upload the build directory
        if-no-files-found: error

    - name: Upload Release Asset (Conditional)
      if: ${{ matrix.build_type == 'Release' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.build.outputs.artifact_path }}/boboost #Path to the executable
        asset_name: boboost-${{ matrix.os }}.${{ matrix.build_type }}.zip #Adjust extension as needed
        asset_content_type: application/zip
