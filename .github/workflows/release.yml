name: Build and Release

on:
  push:
    branches:
      - laba6
  pull_request:
    branches:
      - laba6

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up CMake
        uses: kitware/cmake@v1

      - name: Build on Linux
        run: |
          cmake -B build -S.
          cmake --build build
          cpack -G ZIP.

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v3
        with:
        name: projecting-linux
        path: projecting-0.0.1-Linux.zip

      - name: Set up Windows environment
        run: |
          curl -o /usr/bin/wine https://raw.githubusercontent.com/KrumpetPirate/wine-install/master/install-wine.sh
          chmod +x /usr/bin/wine
          /usr/bin/wine --version

      - name: Build on Windows
        run: |
          mkdir build-win
          cd build-win
          cmake -G "MinGW Makefiles"../
          make
          cpack -G ZIP.

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
        name: projecting-windows
        path: build-win/projecting-0.0.1-Windows.zip

      - name: Create release
        uses: softprops/create-release@v2
        with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: v0.0.1
        release_name: Release v0.0.1
        draft: false
        prerelease: false

      - name: Upload release assets
        uses: softprops/upload-release-asset@v1
        with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: projecting-0.0.1-Linux.zip
        asset_name: projecting-0.0.1-Linux.zip

      - name: Upload Windows release asset
        uses: softprops/upload-release-asset@v1
        with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: build-win/projecting-0.0.1-Windows.zip
        asset_name: projecting-0.0.1-Windows.zip