name: C++ CI

on:
  push:
    branches:
      - laba7
      - feature/github_actions

jobs:
  build_ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libboost-test-dev -y

      - name: List Files for debugging purposes
        run: |
          ls -R

      - name: Clean Build Directory
        run: rm -rf build

      - name: Download Boost 1.86.0
        run: |
          wget https://boostorg.jfrog.io/artifactory/main/release/1.86.0/source/boost_1_86_0.tar.bz2
          tar -xvjf boost_1_86_0.tar.bz2
          mv boost_1_86_0 boost

      - name: Build Boost
        run: |
          cd boost
          ./bootstrap.sh --with-libraries=program_options,system,filesystem # Specify needed libraries
          ./b2 install --prefix=$(pwd)/install # Install to a subdirectory of boost
          cd ..

      - name: Configure CMake with Local Boost
        run: |
          cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT=./boost/install -DCMAKE_CXX_FLAGS="-std=c++17" --no-warn-unused-cli

      - name: Build Project
        run: cmake --build build --verbose

      - name: Package Project
        run: cmake --build build --target package --verbose

      - name: List Files in Build Directory
        run: ls -R build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Ubuntu)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset-ubuntu
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/boboost-0.0.${{ github.run_number }}-Linux.deb
          asset_name: boboost-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build_windows:
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install 7-Zip
        uses: EnixCoding/setup-7zip@v1.0.1

      - name: Download Boost 1.86.0 (Windows)
        run: |
          Invoke-WebRequest -Uri "https://boostorg.jfrog.io/artifactory/main/release/1.86.0/source/boost_1_86_0.tar.bz2" -OutFile "boost_1_86_0.tar.bz2" -TimeoutSec 600
          if (!(Test-Path "boost_1_86_0.tar.bz2")) {
              Write-Host "Error: File download failed."
              exit 1
          }
          7z x boost_1_86_0.tar.bz2 -y # -y for automatic "yes" to prompts
          mv boost_1_86_0 boost

      - name: Build Boost (Windows)
        run: |
          cd boost
          .\bootstrap.bat --with-libraries=program_options,system,filesystem --loglevel=all
          .\b2 install --prefix=$(pwd)/install --toolset=msvc-14.42 -d2
          cd ..

      - name: Configure CMake with Local Boost (Windows)
        run: |
          cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT=./boost/install -DCMAKE_CXX_FLAGS="-std=c++17" --no-warn-unused-cli -G "Visual Studio 17 2022"

      - name: Build Project (Windows)
        run: cmake --build build --config Release --verbose

      - name: Package Project (Windows)
        run: cmake --build build --target package --config Release --verbose

      - name: List Files in Build Directory
        run: dir build

      - name: Create Release (Windows)
        id: create_release_windows
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: windows${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Windows)
          draft: false
          prerelease: false

      - name: Upload Release Asset (Windows)
        id: upload-release-asset-windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_windows.outputs.upload_url }}
          asset_path: ./build/Release/boboost-0.0.${{ github.run_number }}-win64.zip # Adjust path if needed
          asset_name: boboost-0.0.${{ github.run_number }}-win64.zip # Adjust name if needed