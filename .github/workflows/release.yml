name: 'C++ CI'

on:
 push:
  branches:
   - laba5
   - feature/github_actions

jobs:
 build:
  runs-on: ${{ matrix.os }}
  strategy:
   matrix:
    os: [ubuntu-latest, windows-latest]
  permissions: write-all
  steps:
   - uses: actions/checkout@v3
    with:
     submodules: true

   - name: Install Dependencies
    if: matrix.os == 'ubuntu-latest'
    run: sudo apt-get update && sudo apt-get install libboost-test-dev -y

   - name: Configure CMake
    run: |
     cmake -S. -B build -DCMAKE_INSTALL_PREFIX=release -DPATCH_VERSION=${{ github.run_number }}
     
   - name: Build Project
    run: cmake --build build --target install

   - name: Build Package
    run: cmake --build build --target create_package

   - name: List Files in Build Directory (Debugging)
    run: |
     if [[ "$GITHUB_OS" == "Linux" ]]; then
      ls -R build;
     else
      dir build;
     fi

   - name: Upload Release Asset
    id: upload-release-asset
    uses: actions/upload-release-asset@v1
    env:
     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
     upload_url: ${{ steps.create_release.outputs.upload_url }}
     asset_path: ./release/${{ matrix.os == 'windows-latest' && 'physics-0.0.${{ github.run_number }}-win64.zip' || 'physics-0.0.${{ github.run_number }}-Linux.deb' }}
     asset_name: ${{ matrix.os == 'windows-latest' && 'physics-0.0.${{ github.run_number }}-win64.zip' || 'physics-0.0.${{ github.run_number }}-Linux.deb' }}
     asset_content_type: ${{ matrix.os == 'windows-latest' && 'application/zip' || 'application/vnd.debian.binary-package' }}


   - name: Create Release
    if: ${{ matrix.os == 'ubuntu-latest' }}
    id: create_release
    uses: actions/create-release@v1
    env:
     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
     tag_name: v${{ github.run_number }}
     release_name: Release ${{ github.run_number }} (Linux/Windows) #Combined Release
     draft: false
     prerelease: false
