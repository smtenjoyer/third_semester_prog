name: CI

on:
push:
  branches:
  - laba5
pull_request:
  branches:
  - laba5

jobs:
build:
  runs-on: ubuntu-latest
  steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up C++ environment
    uses: actions/setup-java@v3
    with:
    java-version: '17'
    distribution: 'temurin' # or 'adopt'

  - name: Install CMake
    run: sudo apt-get update && sudo apt-get install -y cmake

  - name: Install dependencies
    run: sudo apt-get update && sudo apt-get install -y build-essential libsfml-graphics-dev # Add other Linux dependencies if needed.

  - name: Copy resources
    run: cp -r resources build/

  - name: Build Linux
    run: |
          cd build
          cmake ..
          make
          make test # Run tests if you have them

  - name: Create Linux Artifact
    uses: actions/upload-artifact@v3
    with:
    name: linux-artifact
    path: build/physics

  steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Setup MSVC environment
    uses: microsoft/setup-msbuild@v1
    with:
    version: 'latest'

  - name: Copy resources
    run: copy resources build

  - name: Build Windows
    run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" ..
          cmake --build . --config Release


  - name: Create Windows Artifact
    uses: actions/upload-artifact@v3
    with:
    name: windows-artifact
    path: build/Release/physics.exe


release: # This job runs only on pushes to the main branch
  needs: build
  runs-on: ubuntu-latest # Could be changed to a Windows runner if needed for release artifact packaging.
  steps:
  - name: Download artifacts
    uses: actions/download-artifact@v3
    with:
    name: linux-artifact
    path: linux-artifacts
    name: windows-artifact
    path: windows-artifacts

  - name: Create Release
    uses: actions/github-script@v6
    with:
    github-token: ${{ secrets.GITHUB_TOKEN }}
    script: |
      const releaseName = `v${process.env.GITHUB_REF.replace('refs/heads/', '')}`;
      const assets = [
      { name: "physics-linux", path: "linux-artifacts/physics" },
      { name: "physics-windows.exe", path: "windows-artifacts/physics.exe"}
      ];
      const releaseResponse = await github.rest.repos.createRelease({
      owner: context.repo.owner,
      repo: context.repo.repo,
      tag_name: releaseName,
      name: releaseName,
      body: "Release description here",
      draft: false,
      prerelease: false,
      });
      for (const asset of assets) {
      await github.rest.repos.uploadReleaseAsset({
        owner: context.repo.owner,
        repo: context.repo.repo,
        release_id: releaseResponse.data.id,
        name: asset.name,
        data: fs.readFileSync(asset.path)
      });
      }
