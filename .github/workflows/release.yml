name: 'C++ CI'

on:
  push:
    branches:
      - laba5
      - feature/github_actions

jobs:
  build_ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsfml-dev cmake build-essential

      - name: List Files
        run: |
          ls -R

      - name: Configure CMake
        run: |
          cmake -S. -B build -DPATCH_VERSION=${{ github.run_number }}

      - name: Package Project
        run: |
          cmake --build build --target package

      - name: List Files in Build Directory
        run: |
          ls -R build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Ubuntu)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset-ubuntu
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path:./build/physics-0.0.${{ github.run_number }}-Linux.deb
          asset_name: physics-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package
          allowUpdates: true

  build_windows:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: |
          choco install cmake sfml

      - name: Configure CMake
        run: |
          cmake. -DPATCH_VERSION=${{ github.run_number }} -B build

      - name: Build Project
        run: cmake --build build

      - name: Package Project
        run: |
          cmake --build build --target package

      - name: List Files in Build Directory
        run: dir

      - name: Create Release (Windows)
        id: create_release_windows
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: windows${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Windows)
          draft: false
          prerelease: false

      - name: Upload Release Asset (Windows)
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_windows.outputs.upload_url }}
          asset_path: ./build/physics-0.0.${{ github.run_number }}-win64.zip
          asset_name: physics-0.0.${{ github.run_number }}-win64.zip
          asset_content_type: application/zip
          allowUpdates: true