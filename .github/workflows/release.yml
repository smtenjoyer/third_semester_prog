name: Build and Release

on:
  push:
    branches:
      - laba5
      - feature/github_actions

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Set up CMake
        uses: kitware/cmake@v1

      - name: Build on Linux
        run: |
          cmake -B build -S.
          cmake --build build
          cp -r resources build/

      - name: Create Debian package on Linux
        run: |
          cpack -B build --config CPackConfig.cmake

      - name: Upload Debian package
        uses: actions/upload-artifact@v3
        with:
          name: physics.deb
          path: build/physics-0.0.1-Linux.deb

  build-windows:
    runs-on: windows-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Set up Windows environment
        uses: actions/setup-msvc@v1
        with:
          msvc: '2022'

      - name: Build on Windows
        run: |
          cmake -B build -S.
          cmake --build build
          xcopy /s /i resources build\

      - name: Create ZIP package on Windows
        run: |
          cpack -B build --config CPackConfig.cmake

      - name: Upload ZIP package
        uses: actions/upload-artifact@v3
        with:
          name: physics.zip
          path: build/physics-0.0.1-Windows.zip

      - name: Create release
        uses: actions/create-release@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v0.0.1
          release_name: Release v0.0.1
          draft: false
          prerelease: false

      - name: Upload release assets for Linux
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: build/physics-0.0.1-Linux.deb
          asset_name: physics.deb

      - name: Upload release assets for Windows
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: build/physics-0.0.1-Windows.zip
          asset_name: physics.zip