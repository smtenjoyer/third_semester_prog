name: C++ CI

on:
  push:
    branches:
      - laba7
      - feature/github_actions

jobs:
  build_ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libboost-all-dev -y  # Install all necessary boost packages

      - name: Create Build Directory
        run: mkdir build

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DPATCH_VERSION=${{ github.run_number }}

      - name: Build Project
        run: cmake --build build --verbose

      - name: Package Project
        run: cpack -C Release -G DEB  #Generate the deb package in release mode

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Ubuntu)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/boboost_${PROJECT_VERSION}-Linux.deb 
          asset_name: boboost_${PROJECT_VERSION}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package


  build_macos:
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - run: brew install boost
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }} -DCMAKE_INSTALL_PREFIX=`pwd`/install
      - run: cmake --build . --target install
      - run: cmake --build . --target package
      - run: cpack -G ZIP
      - name: Run Tests
        run: |
          ctest --output-on-failure || exit 1
      - name: Create Release (MacOS)
        id: create_release_macos
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (MacOS)
          draft: false
          prerelease: false
      - name: Upload Release Asset (MacOS)
        id: upload-release-asset-macos
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_macos.outputs.upload_url }}
          asset_path: ./boboost-0.0.${{ github.run_number }}-Darwin.zip #Path changed
          asset_name: boboost-0.0.${{ github.run_number }}-Darwin.zip
          asset_content_type: application/zip