name: C++ CI

on:
  push:
    branches:
      - laba7
      - feature/github_actions

jobs:
  build_ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install libboost-test-dev -y

      - name: List Files for debugging purposes
        run: |
          ls -R

      - name: Clean Build Directory
        run: rm -rf build

      - name: Download Boost 1.86.0
        run: |
          wget https://boostorg.jfrog.io/artifactory/main/release/1.86.0/source/boost_1_86_0.tar.bz2
          tar -xvjf boost_1_86_0.tar.bz2
          mv boost_1_86_0 boost

      - name: Build Boost
        run: |
          cd boost
          ./bootstrap.sh --with-libraries=program_options,system,filesystem # Specify needed libraries
          ./b2 install --prefix=$(pwd)/install # Install to a subdirectory of boost
          cd ..

      - name: Configure CMake with Local Boost
        run: |
          cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DBOOST_ROOT=./boost/install -DCMAKE_CXX_FLAGS="-std=c++17" --no-warn-unused-cli

      - name: Build Project
        run: cmake --build build --verbose

      - name: Package Project
        run: cmake --build build --target package --verbose

      - name: List Files in Build Directory
        run: ls -R build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Ubuntu)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset-ubuntu
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/boboost-0.0.${{ github.run_number }}-Linux.deb
          asset_name: boboost-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build_windows:
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        # No direct equivalent to libboost-test-dev on Windows.  Boost will be downloaded separately.
        #  You may need to install other dependencies based on your project's needs.  This is a placeholder.
        run: |
          choco install vcpkg -y

      - name: List Files for debugging purposes
        run: dir /s /b

      - name: Clean Build Directory
        run: rmdir /s /q build

      - name: Download Boost 1.86.0
        run: |
          Invoke-WebRequest -Uri "https://boostorg.jfrog.io/artifactory/main/release/1.86.0/source/boost_1_86_0.tar.bz2" -OutFile "boost_1_86_0.tar.bz2"
          tar -xvjf boost_1_86_0.tar.bz2
          mv boost_1_86_0 boost

      - name: Build Boost (using vcpkg)
        run: |
          vcpkg install boost:x64-windows --triplet x64-windows

      - name: Configure CMake with Local Boost (using vcpkg)
        run: |
          cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -DCMAKE_CXX_FLAGS="-std:c++17" --no-warn-unused-cli

      - name: Build Project
        run: cmake --build build --verbose --config Release

      - name: Package Project (assuming you have a suitable packaging mechanism)
        # Replace with your actual packaging command.  This is a placeholder.
        #  This example assumes a simple zip archive.  For more robust installers, consider using tools like Inno Setup or NSIS.
        run: |
          mkdir build\release
          7z a build\release\boboost-0.0.${{ github.run_number }}-Windows.zip build\Release\*

      - name: List Files in Build Directory
        run: dir /s /b build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }} (Windows)
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset-windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/release/boboost-0.0.${{ github.run_number }}-Windows.zip
          asset_name: boboost-0.0.${{ github.run_number }}-Windows.zip
          asset_content_type: application/zip